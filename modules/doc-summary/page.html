<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📋 文档</title>
  <style>
    .doc-layout { display:flex; gap:1.5rem; min-height:60vh; }
    .doc-list-panel { width:320px; flex-shrink:0; }
    .doc-content-panel { flex:1; min-width:0; }

    .doc-card {
      background:var(--pico-card-background-color,#fff);
      border:1px solid var(--pico-muted-border-color,#dee2e6);
      border-radius:6px; padding:0.75rem; margin-bottom:0.5rem; cursor:pointer;
      transition:border-color .15s,box-shadow .15s;
    }
    .doc-card:hover { border-color:var(--pico-primary); }
    .doc-card.active { border-color:var(--pico-primary); box-shadow:0 0 0 2px var(--pico-primary-focus,rgba(66,133,244,0.25)); }
    .doc-card-title { font-weight:600; font-size:.95rem; margin-bottom:.25rem; }
    .doc-card-meta { font-size:.8rem; color:var(--pico-muted-color); }
    .doc-card-meta span { margin-right:.75rem; }
    .source-badge { display:inline-block; font-size:.7rem; padding:.1rem .4rem; border-radius:3px; font-weight:500; }
    .source-badge.upload { background:#e3f2fd; color:#1565c0; }
    .source-badge.generated { background:#e8f5e9; color:#2e7d32; }

    .empty-state { text-align:center; padding:3rem 1rem; color:var(--pico-muted-color); }
    .empty-state p { margin-top:.5rem; }

    .doc-view {
      background:var(--pico-card-background-color,#fff);
      border:1px solid var(--pico-muted-border-color,#dee2e6);
      border-radius:6px; padding:1.5rem; overflow-x:auto;
    }
    .doc-view h1 { font-size:1.6rem; margin-top:0; }
    .doc-view h2 { font-size:1.3rem; border-bottom:1px solid var(--pico-muted-border-color,#eee); padding-bottom:.3rem; }
    .doc-view h3 { font-size:1.1rem; }
    .doc-view pre { background:var(--pico-card-background-color,#f5f5f5); border:1px solid var(--pico-muted-border-color,#e0e0e0); border-radius:4px; padding:.75rem; overflow-x:auto; font-size:.85rem; }
    .doc-view code { font-size:.85rem; }
    .doc-view ul, .doc-view ol { padding-left:1.5rem; }

    .toolbar { display:flex; gap:.5rem; margin-bottom:1rem; flex-wrap:wrap; }

    .cp-item {
      background:var(--pico-card-background-color,#fff);
      border:1px solid var(--pico-muted-border-color,#dee2e6);
      border-radius:6px; padding:.75rem; margin-bottom:.5rem; display:flex; gap:.75rem; align-items:flex-start;
    }
    .cp-badge { flex-shrink:0; width:48px; text-align:center; font-size:.75rem; font-weight:600; padding:.2rem 0; border-radius:4px; }
    .cp-badge.add { background:#e8f5e9; color:#2e7d32; }
    .cp-badge.modify { background:#fff3e0; color:#e65100; }
    .cp-badge.del { background:#fce4ec; color:#c62828; }
    .cp-body { flex:1; }
    .cp-file { font-weight:600; font-size:.85rem; font-family:monospace; }
    .cp-summary { font-size:.9rem; margin:.25rem 0; }
    .cp-detail { font-size:.8rem; color:var(--pico-muted-color); }
    .cp-impact { margin-top:.3rem; font-size:.8rem; color:var(--pico-primary); }

    .loading-dots::after { content:''; animation:dots 1.5s steps(4,end) infinite; }
    @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }

    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:999; justify-content:center; align-items:center; }
    .modal-overlay.open { display:flex; }
    .modal-box { background:var(--pico-card-background-color,#fff); border-radius:8px; padding:1.5rem; max-width:780px; width:90%; max-height:85vh; overflow-y:auto; }
    .modal-box h3 { margin-top:0; }

    .commit-selector { max-height:200px; overflow-y:auto; border:1px solid var(--pico-muted-border-color,#dee2e6); border-radius:4px; margin-top:.5rem; }
    .commit-item { padding:.4rem .75rem; cursor:pointer; font-size:.85rem; border-bottom:1px solid var(--pico-muted-border-color,#eee); }
    .commit-item:last-child { border-bottom:none; }
    .commit-item:hover { background:var(--pico-primary-hover-background,#f0f0f0); }
    .commit-item.selected { background:var(--pico-primary-background,#e3f2fd); }
    .commit-sha { font-family:monospace; font-weight:600; }
    .commit-msg { color:var(--pico-muted-color); margin-left:.5rem; }

    /* Diff 摘要标签 */
    .diff-badge { display:inline-block; font-size:.7rem; padding:.1rem .4rem; border-radius:3px; font-weight:500; }
    .diff-badge.add { background:#e8f5e9; color:#2e7d32; }
    .diff-badge.modify { background:#fff3e0; color:#e65100; }
    .diff-badge.del { background:#fce4ec; color:#c62828; }

    .diff-summary-item {
      display:flex; align-items:center; gap:.5rem;
      padding:.35rem .5rem; font-size:.85rem;
      border-bottom:1px solid var(--pico-muted-border-color,#f0f0f0);
    }

    @media (max-width:768px) { .doc-layout { flex-direction:column; } .doc-list-panel { width:100%; } }
  </style>
</head>
<body>
<article>
  <header style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;">
    <h2 style="margin:0;">📋 概括性文档</h2>
    <div class="toolbar" style="margin:0;">
      <button id="uploadBtn" type="button" class="outline">📤 上传文档</button>
      <button id="generateBtn" type="button" class="outline">🤖 生成新版本</button>
      <button id="refreshBtn" type="button" class="outline secondary">🔄 刷新</button>
    </div>
  </header>

  <div class="doc-layout">
    <div class="doc-list-panel">
      <div id="docList"><div class="empty-state"><p>加载中…</p></div></div>
    </div>
    <div class="doc-content-panel">
      <div id="docContent">
        <div class="empty-state"><p style="font-size:2rem;">📄</p><p>从左侧选择一个文档查看内容</p></div>
      </div>
    </div>
  </div>
</article>

<!-- ═══ 上传文档 ═══ -->
<div id="uploadModal" class="modal-overlay">
  <div class="modal-box">
    <h3>📤 上传文档</h3>
    <form id="uploadForm">
      <label>标题<input type="text" id="uploadTitle" placeholder="例如: Worktable 项目概览 v3" required></label>
      <label>关联 Commit SHA（可选）<input type="text" id="uploadCommit" placeholder="完整 SHA 或短 SHA"></label>
      <label>文档内容（Markdown）<textarea id="uploadContent" rows="12" placeholder="在此粘贴 Markdown 内容，或从文件导入…" required></textarea></label>
      <div style="margin-bottom:1rem;">
        <button type="button" id="uploadFileBtn" class="outline secondary">📂 从文件导入</button>
        <input type="file" id="uploadFileInput" accept=".md" style="display:none">
      </div>
      <div class="modal-actions" style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem;">
        <button type="button" class="secondary" onclick="closeModal('uploadModal')">取消</button>
        <button type="submit">上传</button>
      </div>
    </form>
  </div>
</div>

<!-- ═══ 生成文档（4 步骤） ═══ -->
<div id="generateModal" class="modal-overlay">
  <div class="modal-box">
    <h3>🤖 生成新版本</h3>

    <!-- Step 1: 选择基准 -->
    <div id="genStep1">
      <p>选择基准文档和目标 Commit，系统将分析两者之间的代码变更。</p>
      <label>基准文档<select id="genBaseDoc"></select></label>
      <label>目标 Commit
        <div style="display:flex;gap:.5rem;">
          <input type="text" id="genCommitInput" placeholder="输入 commit SHA" style="flex:1;">
          <button type="button" id="genLoadCommits" class="outline secondary" style="white-space:nowrap;">加载 Commit</button>
        </div>
      </label>
      <div id="genCommitList" class="commit-selector" style="display:none;"></div>
      <label>仓库<select id="genRepo"></select></label>
      <div class="modal-actions" style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem;">
        <button type="button" class="secondary" onclick="closeModal('generateModal')">取消</button>
        <button type="button" id="analyzeBtn" class="primary">🔍 分析变更</button>
      </div>
    </div>

    <!-- Step 2: 修改点 → 生成大纲 -->
    <div id="genStep2" style="display:none;">
      <p>以下是根据代码变更分析出的修改要点。<strong>勾选/移除以决定哪些变更要反映到文档中</strong>。</p>
      <div id="changePointsList"></div>
      <div class="modal-actions" style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem;">
        <button type="button" class="secondary" onclick="backToStep('genStep1')">返回</button>
        <button type="button" id="outlineBtn" class="primary">📋 生成大纲</button>
      </div>
    </div>

    <!-- Step 2.5: 大纲预览 + 编辑 -->
    <div id="genStepOutline" style="display:none;">
      <p>以下是根据修改点生成的<strong>文档大纲</strong>。可以修改后再生成完整文档。</p>
      <textarea id="outlineText" rows="12" style="width:100%;font-family:monospace;font-size:.85rem;padding:.5rem;border:1px solid var(--pico-muted-border-color,#dee2e6);border-radius:4px;"></textarea>
      <div class="modal-actions" style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem;">
        <button type="button" class="secondary" onclick="backToStep('genStep2')">返回修改点</button>
        <button type="button" id="generateDocBtn" class="primary">📝 生成完整文档</button>
      </div>
    </div>

    <!-- Step 3: 预览 + 编辑 + Diff 摘要 -->
    <div id="genStep3" style="display:none;">
      <p style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;">
        <span>📝 <strong>文档变更摘要</strong></span>
      </p>
      <div id="diffSummary" style="background:var(--pico-card-background-color,#f9f9f9);border:1px solid var(--pico-muted-border-color,#dee2e6);border-radius:4px;padding:.5rem;margin-bottom:1rem;"></div>

      <p>编辑完成后保存：</p>
      <textarea id="genDocContent" rows="16" style="width:100%;font-family:monospace;font-size:.85rem;padding:.75rem;border:1px solid var(--pico-muted-border-color,#dee2e6);border-radius:4px;resize:vertical;"></textarea>
      <label style="margin-top:.75rem;">
        文档标题
        <input type="text" id="genDocTitle" placeholder="例如: Worktable 项目概览 v4">
      </label>
      <div class="modal-actions" style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem;">
        <button type="button" class="secondary" onclick="backToStep('genStepOutline')">返回大纲</button>
        <button type="button" id="saveDocBtn" class="primary">💾 保存文档</button>
      </div>
    </div>

    <!-- 加载遮罩 -->
    <div id="genLoading" style="display:none;text-align:center;padding:2rem;">
      <p id="genLoadingMsg">处理中<span class="loading-dots"></span></p>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
//  状态
// ═══════════════════════════════════════════════

let docsData = [];
let currentDocId = null;
let genState = {
  baseDocId: null,
  targetCommitSha: null,
  owner: 'TeacherBee',
  repo: 'worktable',
  changePoints: [],
  outline: '',
  generatedContent: '',
};

// ═══════════════════════════════════════════════
//  文档列表
// ═══════════════════════════════════════════════

function loadDocs() {
  document.getElementById('docList').innerHTML = '<div class="empty-state"><p>加载中…</p></div>';
  fetch('/api/doc-summary/docs')
    .then(r => r.json())
    .then(data => {
      docsData = data || [];
      renderDocList();
      if (currentDocId) {
        const stillExists = docsData.find(d => d.id === currentDocId);
        if (stillExists) loadDocContent(currentDocId);
        else { currentDocId = null; showEmptyContent(); }
      }
    })
    .catch(() => { document.getElementById('docList').innerHTML = '<div class="empty-state"><p>加载失败</p></div>'; });
}

function renderDocList() {
  const container = document.getElementById('docList');
  if (!docsData.length) {
    container.innerHTML = '<div class="empty-state"><p>暂无文档</p><p style="font-size:.85rem;">点击「上传文档」或「生成新版本」开始</p></div>';
    return;
  }
  container.innerHTML = docsData.map(d => {
    const active = d.id === currentDocId ? ' active' : '';
    const date = new Date(d.updatedAt).toLocaleDateString('zh-CN');
    const sLabel = d.source === 'upload' ? '上传' : '生成';
    const sClass = d.source === 'upload' ? 'upload' : 'generated';
    return `<div class="doc-card${active}" data-id="${d.id}" onclick="selectDoc('${d.id}')">
      <div class="doc-card-title">${escapeHtml(d.title || '未命名')} <span class="source-badge ${sClass}">${sLabel}</span></div>
      <div class="doc-card-meta">
        <span>v${d.version}</span><span>${date}</span>
        ${d.shortSha ? '<span><code>'+d.shortSha+'</code></span>' : ''}
      </div>
    </div>`;
  }).join('');
}

function selectDoc(id) { currentDocId = id; renderDocList(); loadDocContent(id); }

function loadDocContent(id) {
  const area = document.getElementById('docContent');
  area.innerHTML = '<div class="empty-state"><p>加载中…</p></div>';
  fetch('/api/doc-summary/docs/' + id)
    .then(r => r.json())
    .then(data => {
      if (data.error) { area.innerHTML = '<div class="empty-state"><p>⚠️ ' + escapeHtml(data.error) + '</p></div>'; return; }
      const date = new Date(data.updatedAt).toLocaleString('zh-CN');
      const sLabel = data.source === 'upload' ? '上传' : '生成';
      area.innerHTML =
        `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;flex-wrap:wrap;gap:.5rem;">
          <div><strong>${escapeHtml(data.title)}</strong><span style="font-size:.85rem;color:var(--pico-muted-color);margin-left:.75rem;">v${data.version} · ${date} · ${data.shortSha ? '<code>'+data.shortSha+'</code> · ' : ''}${sLabel}</span></div>
          <button class="outline secondary" style="font-size:.85rem;padding:.25rem .75rem;" onclick="deleteDoc('${data.id}')">🗑 删除</button>
        </div>
        <div class="doc-view">${renderMarkdown(data.content || '')}</div>`;
    })
    .catch(() => { area.innerHTML = '<div class="empty-state"><p>⚠️ 加载失败</p></div>'; });
}

function showEmptyContent() {
  document.getElementById('docContent').innerHTML = '<div class="empty-state"><p style="font-size:2rem;">📄</p><p>从左侧选择一个文档查看内容</p></div>';
}

function deleteDoc(id) {
  if (!confirm('确定要删除此文档吗？')) return;
  fetch('/api/doc-summary/docs/' + id, { method:'DELETE' })
    .then(r => r.json()).then(() => {
      if (currentDocId === id) { currentDocId = null; showEmptyContent(); }
      loadDocs();
    }).catch(() => alert('删除失败'));
}

// ═══════════════════════════════════════════════
//  Markdown 简易渲染
// ═══════════════════════════════════════════════

function renderMarkdown(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  html = html.replace(/\n\n/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  return '<p>' + html + '</p>';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ═══════════════════════════════════════════════
//  刷新 / 上传
// ═══════════════════════════════════════════════

document.getElementById('refreshBtn').addEventListener('click', function() { loadDocs(); });
document.getElementById('uploadBtn').addEventListener('click', function() {
  document.getElementById('uploadTitle').value = '';
  document.getElementById('uploadCommit').value = '';
  document.getElementById('uploadContent').value = '';
  openModal('uploadModal');
});
document.getElementById('uploadFileBtn').addEventListener('click', () => document.getElementById('uploadFileInput').click());
document.getElementById('uploadFileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    document.getElementById('uploadContent').value = ev.target.result;
    const name = file.name.replace(/\.md$/i, '');
    if (!document.getElementById('uploadTitle').value) document.getElementById('uploadTitle').value = name;
  };
  reader.readAsText(file);
});
document.getElementById('uploadForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const title = document.getElementById('uploadTitle').value.trim();
  const commitSha = document.getElementById('uploadCommit').value.trim();
  const content = document.getElementById('uploadContent').value.trim();
  if (!title || !content) return alert('请填写标题和文档内容');
  fetch('/api/doc-summary/upload', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title,commitSha,content}) })
    .then(r => r.json())
    .then(data => { if (data.error) { alert(data.error); return; } closeModal('uploadModal'); loadDocs(); })
    .catch(() => alert('上传失败'));
});

// ═══════════════════════════════════════════════
//  生成文档（4 步骤）
// ═══════════════════════════════════════════════

document.getElementById('generateBtn').addEventListener('click', () => {
  if (!docsData.length) { alert('请先上传或存在至少一个文档作为基准版本'); return; }
  genState = { baseDocId:null, targetCommitSha:null, owner:'TeacherBee', repo:'worktable', changePoints:[], outline:'', generatedContent:'' };
  openModal('generateModal');
  resetGenSteps();
  loadGenRepos();
});

function resetGenSteps() {
  ['genStep1','genStep2','genStepOutline','genStep3','genLoading'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
  document.getElementById('genStep1').style.display = 'block';
  document.getElementById('changePointsList').innerHTML = '';
  document.getElementById('diffSummary').innerHTML = '';
  document.getElementById('genDocContent').value = '';
  document.getElementById('genDocTitle').value = '';

  const select = document.getElementById('genBaseDoc');
  select.innerHTML = docsData.map(d =>
    '<option value="'+d.id+'">v'+d.version+' '+escapeHtml(d.title)+' ('+(d.shortSha||'无commit')+')</option>'
  ).join('');
  if (docsData.length) genState.baseDocId = docsData[0].id;
  select.onchange = () => { genState.baseDocId = select.value; };
}

function loadGenRepos() {
  const select = document.getElementById('genRepo');
  fetch('/api/repo-browser/repos')
    .then(r => r.json())
    .then(repos => {
      if (repos && repos.length) {
        select.innerHTML = repos.map(r => '<option value="'+r.owner+'/'+r.repo+'">'+escapeHtml(r.label)+'</option>').join('');
        const first = repos[0];
        genState.owner = first.owner; genState.repo = first.repo;
        select.onchange = () => { const p = select.value.split('/'); genState.owner = p[0]; genState.repo = p[1]; };
      } else { select.innerHTML = '<option value="">无仓库</option>'; }
    })
    .catch(() => { select.innerHTML = '<option value="">加载失败</option>'; });
}

// Commit 列表
document.getElementById('genLoadCommits').addEventListener('click', () => {
  const container = document.getElementById('genCommitList');
  container.style.display = 'block';
  container.innerHTML = '<div style="padding:.5rem;text-align:center;">加载中…</div>';
  fetch('/api/repo-browser/commits?owner='+genState.owner+'&repo='+genState.repo+'&per_page=20')
    .then(r => r.json())
    .then(data => {
      const commits = data.commits || [];
      if (!commits.length) { container.innerHTML = '<div style="padding:.5rem;text-align:center;">暂无 commit</div>'; return; }
      container.innerHTML = commits.map(c =>
        '<div class="commit-item" onclick="selectGenCommit(\''+c.sha+'\',this)">' +
          '<span class="commit-sha">'+c.shortSha+'</span>' +
          '<span class="commit-msg">'+escapeHtml(c.message)+'</span>' +
          '<span style="float:right;font-size:.75rem;color:var(--pico-muted-color);">'+escapeHtml(c.author)+'</span>' +
        '</div>'
      ).join('');
    })
    .catch(() => { container.innerHTML = '<div style="padding:.5rem;text-align:center;">加载失败</div>'; });
});

function selectGenCommit(sha, el) {
  genState.targetCommitSha = sha;
  document.getElementById('genCommitInput').value = sha;
  document.querySelectorAll('.commit-item').forEach(i => i.classList.remove('selected'));
  el.classList.add('selected');
}
document.getElementById('genCommitInput').addEventListener('input', function() { genState.targetCommitSha = this.value.trim(); });

// Step 1 → Step 2: 分析变更
document.getElementById('analyzeBtn').addEventListener('click', () => {
  if (!genState.baseDocId) return alert('请选择基准文档');
  if (!genState.targetCommitSha) return alert('请输入目标 Commit');
  showGenLoading('正在获取代码差异并分析变更');
  document.getElementById('genStep1').style.display = 'none';
  fetch('/api/doc-summary/analyze', { method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ baseDocId:genState.baseDocId, targetCommitSha:genState.targetCommitSha, owner:genState.owner, repo:genState.repo }) })
    .then(r => r.json())
    .then(data => {
      hideGenLoading();
      if (data.error) { alert(data.error); backToStep('genStep1'); return; }
      genState.changePoints = data.changePoints || [];
      if (!genState.changePoints.length) { alert(data.message || '无显著代码变更'); backToStep('genStep1'); return; }
      document.getElementById('genStep2').style.display = 'block';
      renderChangePoints();
    })
    .catch(err => { hideGenLoading(); alert('分析失败: '+err.message); backToStep('genStep1'); });
});

function renderChangePoints() {
  const container = document.getElementById('changePointsList');
  if (!genState.changePoints.length) { container.innerHTML = '<p>无修改点</p>'; return; }
  container.innerHTML = genState.changePoints.map((cp, i) => {
    const map = {'新增':'add','修改':'modify','删除':'del'};
    const cls = map[cp.type]||'modify';
    return `<div class="cp-item">
      <div class="cp-badge ${cls}">${cp.type||'修改'}</div>
      <div class="cp-body">
        <div class="cp-file">${escapeHtml(cp.file||'')}</div>
        <div class="cp-summary">${escapeHtml(cp.summary||'')}</div>
        <div class="cp-detail">${escapeHtml(cp.details||'')}</div>
        <div class="cp-impact">📝 ${escapeHtml(cp.docImpact||'')}</div>
        <button class="outline secondary" style="font-size:.75rem;padding:.15rem .5rem;margin-top:.3rem;" onclick="removeChangePoint(${i})">✕ 移除</button>
      </div>
    </div>`;
  }).join('');
}

function removeChangePoint(idx) {
  genState.changePoints.splice(idx, 1);
  renderChangePoints();
  if (!genState.changePoints.length) { alert('所有修改点已移除'); backToStep('genStep1'); }
}

// Step 2 → Step 2.5: 生成大纲
document.getElementById('outlineBtn').addEventListener('click', () => {
  if (!genState.changePoints.length) return alert('没有修改点');
  showGenLoading('正在根据修改点生成文档大纲');
  document.getElementById('genStep2').style.display = 'none';
  fetch('/api/doc-summary/outline', { method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ baseDocId:genState.baseDocId, changePoints:genState.changePoints }) })
    .then(r => r.json())
    .then(data => {
      hideGenLoading();
      if (data.error) { alert('生成大纲失败: '+data.error); backToStep('genStep2'); return; }
      genState.outline = data.outline || '';
      document.getElementById('genStepOutline').style.display = 'block';
      document.getElementById('outlineText').value = genState.outline;
    })
    .catch(err => { hideGenLoading(); alert('生成大纲失败: '+err.message); backToStep('genStep2'); });
});

// Step 2.5 → Step 3: 生成完整文档
document.getElementById('generateDocBtn').addEventListener('click', () => {
  const outline = document.getElementById('outlineText').value.trim();
  if (!outline) return alert('大纲不能为空');
  genState.outline = outline;
  if (!genState.changePoints.length) return alert('没有修改点');
  showGenLoading('正在根据大纲生成完整文档');
  document.getElementById('genStepOutline').style.display = 'none';
  fetch('/api/doc-summary/generate', { method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ baseDocId:genState.baseDocId, outline:genState.outline, changePoints:genState.changePoints }) })
    .then(r => r.json())
    .then(data => {
      hideGenLoading();
      if (data.error) { alert('生成失败: '+data.error); backToStep('genStepOutline'); return; }
      genState.generatedContent = data.content || '';
      document.getElementById('genStep3').style.display = 'block';
      document.getElementById('genDocContent').value = genState.generatedContent;
      // 生成 diff 摘要（从 changePoints 构建）
      renderDiffSummary();
      const baseDoc = docsData.find(d => d.id === genState.baseDocId);
      const nextVer = docsData.length + 1;
      document.getElementById('genDocTitle').value = (baseDoc ? baseDoc.title : '项目概览').replace(/\s*v\d+$/,'') + ' v' + nextVer;
    })
    .catch(err => { hideGenLoading(); alert('生成失败: '+err.message); backToStep('genStepOutline'); });
});

function renderDiffSummary() {
  const container = document.getElementById('diffSummary');
  const typeMap = {'新增':'🟢 新增','修改':'🟡 修改','删除':'🔴 删除'};
  const badgeMap = {'新增':'add','修改':'modify','删除':'del'};
  container.innerHTML = genState.changePoints.map(cp =>
    '<div class="diff-summary-item">' +
      '<span class="diff-badge '+ (badgeMap[cp.type]||'modify') +'">'+ (typeMap[cp.type]||cp.type) +'</span>' +
      '<code>'+escapeHtml(cp.file)+'</code>' +
      '<span style="color:var(--pico-muted-color);">— '+escapeHtml(cp.summary)+'</span>' +
    '</div>'
  ).join('');
  if (!genState.changePoints.length) {
    container.innerHTML = '<div class="empty-state" style="padding:1rem;"><p>无变更</p></div>';
  }
}

// 保存
document.getElementById('saveDocBtn').addEventListener('click', () => {
  const title = document.getElementById('genDocTitle').value.trim();
  const content = document.getElementById('genDocContent').value.trim();
  if (!title) return alert('请填写文档标题');
  if (!content) return alert('文档内容不能为空');
  fetch('/api/doc-summary/save', { method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ content, title, commitSha:genState.targetCommitSha, source:'generated' }) })
    .then(r => r.json())
    .then(data => {
      if (data.error) { alert('保存失败: '+data.error); return; }
      closeModal('generateModal');
      loadDocs();
    })
    .catch(() => alert('保存失败'));
});

// 步骤导航工具
function backToStep(stepId) {
  ['genStep1','genStep2','genStepOutline','genStep3','genLoading'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
  document.getElementById(stepId).style.display = 'block';
}

function showGenLoading(msg) {
  document.getElementById('genLoadingMsg').textContent = msg || '处理中';
  document.getElementById('genLoading').style.display = 'block';
}
function hideGenLoading() {
  document.getElementById('genLoading').style.display = 'none';
}

// ═══════════════════════════════════════════════
//  模态框
// ═══════════════════════════════════════════════

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('open'); });
});

// ═══════════════════════════════════════════════
//  初始化
// ═══════════════════════════════════════════════

document.addEventListener('DOMContentLoaded', function() { loadDocs(); });
// 页面通过 innerHTML 注入时 DOMContentLoaded 已过，直接调用
if (document.readyState !== 'loading') loadDocs();
</script>
</body>
</html>
